name: CD Automation LXC Deployment

# on:
#   push:
#     branches: [ "pysearch-k3s" ]

on:
  workflow_run:
    workflows: ["Continuous Integration"]  # runs after successful CI workflow
    types:
      - completed

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- STEP 1: DEPLOY & ORCHESTRATE DOCKER COMPOSE VIA SSH ---
      - name: SSH, Sync Code, Build Secrets, and Compose Up
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 'automation.mallickboy.com'
          port: 2222
          username: 'root'
          key: ${{ secrets.AUTOMATION_LXC_SSH_KEY }}
          script: |
            # Clone or navigate to the deployment directory on my LXC
            if [ ! -d "/pysearch-cd" ]; then
              git clone https://github.com/mallickboy/k3s.git /pysearch-cd
            fi
            cd /pysearch-cd
            
            # Fetch and hard-align to the pysearch-k3s branch
            git fetch origin
            git checkout pysearch-k3s
            git pull origin pysearch-k3s
            git reset --hard origin/pysearch-k3s

            if command -v ufw > /dev/null; then
              ufw allow 3000/tcp
            fi
            
            # --- SECRET INJECTION ---
            # Create the .env file exactly where docker-compose.yml expects it (at the root)
            echo "PINECONE_KEY=${{ secrets.PINECONE_KEY }}" > .env
            echo "PINECONE_ENVIRONMENT=${{ secrets.PINECONE_ENVIRONMENT }}" >> .env
            echo "PINECONE_INDEX=${{ secrets.PINECONE_INDEX }}" >> .env
            echo "PINECONE_NAMESPACE=${{ secrets.PINECONE_NAMESPACE }}" >> .env
            
            # --- DOCKER CONTEXT EXECUTION ---
            # Drop old containers, rebuild layers using your root configs, and launch detached
            mkdir -p model_cache
            docker compose down || true
            docker compose up -d --build
            
            # Give the container 5 seconds to run start.sh and initialize models
            sleep 5
            
            # 6. Resolve Environment venv and pip dependencies locally on the LXC
            echo "Ensuring testing packages are installed on LXC system..."
            apt-get update -y && apt-get install -y python3-venv python3-pip

            # 7. Run E2E Verification Tests inside local container loopback context
            echo "Beginning Local End-to-End Tests inside LXC..."
            export TARGET_API_URL="http://127.0.0.1:3000"
            
            python3 -m venv test-env
            source test-env/bin/activate
            
            pip install -r tests/requirements.txt || pip install pytest requests
            pytest tests/integration_prod -v
            
            # 8. Clean up workspace environments inside the machine directory
            deactivate
            rm -rf test-env